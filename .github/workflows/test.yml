name: test

on:
  push:
  pull_request:

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q examples evaluate.py
      - name: Run deterministic demo
        run: python examples/01-single-agent-tool-calling/agent.py --demo --goal "prepare for a HYROX race"
      - name: Run evaluation checks
        run: python evaluate.py
